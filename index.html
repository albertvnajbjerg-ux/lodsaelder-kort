<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lodsælder">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>📍 Lodsælder Kort</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:Segoe UI,system-ui,sans-serif;background:#1a1a2e;color:#fff}
#map{width:100%;height:100%}

#stats{
  position:fixed;top:10px;left:10px;right:10px;z-index:1000;
  background:rgba(26,26,46,.92);backdrop-filter:blur(8px);
  border-radius:14px;padding:10px 14px;
  display:flex;flex-wrap:wrap;justify-content:space-around;gap:2px 8px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);
  max-width:500px;margin:0 auto;cursor:pointer;
}
.stat{display:flex;align-items:center;gap:6px}
.stat-icon{font-size:16px}
.stat-text{font-size:13px;line-height:1.3}
.stat-label{opacity:.6;font-size:11px}
.stat-value{font-weight:700;font-size:15px}
.stat-value.green{color:#4ade80}
.stat-value.gold{color:#fbbf24}
.stat-value.blue{color:#60a5fa}
.stat-value.red{color:#f87171}
.stat-value.pink{color:#f472b6}
.stat-value.amber{color:#f59e0b}
.stat-value.cyan{color:#22d3ee}
.stat-value.lime{color:#a3e635}
.stat-value.purple{color:#c084fc}
.work-only{display:none}
body.working .work-only{display:flex}
body.working .idle-only{display:none}
#stop-btn{display:none}
body.working #stop-btn{display:flex}

#bottom-bar{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;
  display:flex;gap:8px;align-items:center;
  max-width:500px;width:calc(100% - 40px);
}
.btn{
  padding:12px 20px;border:none;border-radius:12px;font-size:15px;font-weight:600;
  cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 15px rgba(0,0,0,.3);
}
.btn:active{transform:scale(.95)}
.btn-primary{background:#4f46e5;color:#fff;flex:1;justify-content:center}
.btn-primary:hover{background:#4338ca}
.btn-icon{
  width:46px;height:46px;padding:0;border:none;border-radius:50%;
  background:rgba(26,26,46,.9);color:#fff;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 15px rgba(0,0,0,.3);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);transition:all .15s;
}
.btn-icon:active{transform:scale(.9)}

/* Dialogs */
.dialog-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;
  background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center;
}
.dialog-overlay.active{display:flex}
.dialog-overlay.center{align-items:center}

.dialog{
  background:#1e1e3a;border-radius:20px 20px 0 0;padding:24px 20px;
  width:100%;max-width:500px;max-height:80vh;overflow-y:auto;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
  border-top:1px solid rgba(255,255,255,.1);
  animation:slideUp .25s ease-out;
}
.dialog.center-dialog{
  border-radius:20px;margin:20px;width:calc(100% - 40px);
  animation:fadeIn .2s ease-out;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.dialog h2{font-size:18px;margin-bottom:4px;text-align:center}
.dialog p{font-size:14px;color:rgba(255,255,255,.6);text-align:center;margin-bottom:16px}
.dialog .sub{font-size:13px;color:rgba(255,255,255,.4);text-align:center;margin-bottom:16px}

.amount-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px;
}
.amount-btn{
  padding:14px 8px;border:2px solid rgba(255,255,255,.12);border-radius:12px;
  background:rgba(255,255,255,.05);color:#fff;font-size:20px;font-weight:700;
  cursor:pointer;transition:all .1s;text-align:center;
}
.amount-btn.sel{background:rgba(79,70,229,.3);border-color:#4f46e5}
.amount-btn.zero-btn.sel{background:rgba(248,113,113,.25);border-color:#f87171}

.custom-input-row{display:flex;gap:8px;margin-bottom:16px}
.custom-input-row input{
  flex:1;padding:12px 16px;border:2px solid rgba(255,255,255,.12);border-radius:12px;
  background:rgba(255,255,255,.05);color:#fff;font-size:16px;outline:none;
}
.custom-input-row input:focus{border-color:#4f46e5}
.custom-input-row input::placeholder{color:rgba(255,255,255,.3)}

.dialog-confirm-btn{
  width:100%;padding:14px;background:#4f46e5;color:#fff;border:none;
  border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;
}
.dialog-confirm-btn:active{transform:scale(.97)}
.dialog-cancel-btn{
  width:100%;padding:10px;background:transparent;color:rgba(255,255,255,.5);
  border:none;border-radius:12px;font-size:14px;cursor:pointer;margin-top:4px;
}

/* Inventory dialog */
#inv-dialog h2{font-size:18px;margin-bottom:12px}
#inv-dialog label{display:block;font-size:13px;color:rgba(255,255,255,.6);margin-bottom:4px;text-align:left}
#inv-input{
  width:100%;padding:12px 16px;border:2px solid rgba(255,255,255,.12);border-radius:12px;
  background:rgba(255,255,255,.05);color:#fff;font-size:18px;font-weight:700;outline:none;margin-bottom:16px;
}
#inv-input:focus{border-color:#4f46e5}
#inv-dialog .btn-row{display:flex;gap:8px}
#inv-dialog .btn-row button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
#inv-save{background:#4f46e5;color:#fff}
#inv-cancel{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
.inv-divider{border:none;border-top:1px solid rgba(255,255,255,.08);margin:14px 0}
.inv-sub-row{display:flex;gap:8px;align-items:center}
.inv-sub-row input{flex:1;padding:12px 14px;border:2px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font-size:16px;outline:none;min-width:0}
.inv-sub-row input:focus{border-color:#f87171}
#inv-subtract-btn{padding:12px 18px;border:none;border-radius:12px;background:#ef4444;color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .1s}
#inv-subtract-btn:active{transform:scale(.95)}

/* Stats overlay */
.stats-toggle{
  display:flex;gap:0;margin-bottom:16px;border-radius:12px;overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
}
.stats-toggle button{
  flex:1;padding:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);transition:all .15s;
}
.stats-toggle button.active{background:rgba(79,70,229,.3);color:#fff}
.detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;
}
.detail-row:last-child{border-bottom:none}
.detail-label{color:rgba(255,255,255,.5)}
.detail-val{font-weight:700;font-size:15px}

/* Menu dialog */
.menu-list{list-style:none}
.menu-list li button{
  width:100%;padding:14px 16px;border:none;border-radius:12px;
  background:rgba(255,255,255,.05);color:#fff;font-size:15px;font-weight:500;
  cursor:pointer;transition:all .1s;text-align:left;display:flex;align-items:center;gap:10px;margin-bottom:6px;
}
.menu-list li button:hover{background:rgba(255,255,255,.1)}
.menu-list .danger{color:#f87171}

/* Zoom */
.leaflet-control-zoom a{background:#1e1e3a!important;color:#fff!important;border-color:rgba(255,255,255,.15)!important}

/* Marker popup */
.sold-popup .leaflet-popup-content-wrapper{background:#1e1e3a;color:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.sold-popup .leaflet-popup-tip{background:#1e1e3a}
.sold-popup .leaflet-popup-content{margin:12px 14px;text-align:center}
.sold-popup .popup-sold{font-size:22px;font-weight:700}
.sold-popup .popup-label{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:4px}
.popup-btn{
  border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;margin:2px;transition:all .1s;
}
.popup-edit-btn{background:rgba(79,70,229,.2);color:#818cf8;border:1px solid rgba(79,70,229,.3)}
.popup-edit-btn:hover{background:rgba(79,70,229,.35)}
.popup-delete-btn{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.25)}
.popup-delete-btn:hover{background:rgba(248,113,113,.3)}
.popup-btn-row{display:flex;gap:6px;justify-content:center;margin-top:6px}

/* Map */
.leaflet-control-attribution{background:rgba(26,26,46,.85)!important;color:rgba(255,255,255,.4)!important;font-size:10px!important}
.leaflet-control-attribution a{color:rgba(255,255,255,.5)!important}
.leaflet-marker-icon.leaflet-div-icon{background:0 0;border:none}
</style>
</head>
<body>

<div id="map"></div>

<div id="stats" onclick="openStatsOverlay()">
  <!-- Idle stats -->
  <div class="stat idle-only">
    <span class="stat-icon">🏠</span>
    <div class="stat-text">
      <div class="stat-label">Solgte</div>
      <div class="stat-value green" id="sold-count">0</div>
    </div>
  </div>
  <div class="stat idle-only">
    <span class="stat-icon">👛</span>
    <div class="stat-text">
      <div class="stat-label">Tjent</div>
      <div class="stat-value gold" id="earned-amount">0 kr</div>
    </div>
  </div>
  <div class="stat idle-only">
    <span class="stat-icon">📦</span>
    <div class="stat-text">
      <div class="stat-label">Tilbage</div>
      <div class="stat-value blue" id="remaining-count">100</div>
    </div>
  </div>
  <!-- Work stats -->
  <div class="stat work-only">
    <span class="stat-icon">⏱️</span>
    <div class="stat-text">
      <div class="stat-label">Tid</div>
      <div class="stat-value" id="timer-display" style="color:#fff">0:00:00</div>
    </div>
  </div>
  <div class="stat work-only">
    <span class="stat-icon">🛒</span>
    <div class="stat-text">
      <div class="stat-label">Solgt nu</div>
      <div class="stat-value cyan" id="sold-now">0 stk</div>
    </div>
  </div>
  <div class="stat work-only">
    <span class="stat-icon">🏠</span>
    <div class="stat-text">
      <div class="stat-label">I alt solgt</div>
      <div class="stat-value green" id="sold-total-work">0 stk</div>
    </div>
  </div>
  <div class="stat work-only">
    <span class="stat-icon">💰</span>
    <div class="stat-text">
      <div class="stat-label">Time løn</div>
      <div class="stat-value lime" id="hourly-wage">0 kr</div>
    </div>
  </div>
</div>

<div id="bottom-bar">
  <button class="btn btn-primary" id="inventory-btn">📦 Opdater lager</button>
  <button class="btn-icon" id="stop-btn" title="Stop timer" style="background:rgba(239,68,68,.9)">⏹️</button>
  <button class="btn-icon" id="menu-btn" title="Menu">⚙️</button>
</div>

<!-- Stats overlay -->
<div class="dialog-overlay center" id="stats-overlay">
  <div class="dialog center-dialog" style="max-width:340px">
    <h2>📊 Statistik</h2>
    <div class="stats-toggle" id="stats-toggle">
      <button class="active" data-mode="route">Aktuel rute</button>
      <button data-mode="all">I alt</button>
    </div>
    <div id="stats-detail"></div>
    <button class="dialog-cancel-btn" onclick="document.getElementById('stats-overlay').classList.remove('active')" style="margin-top:12px">Luk</button>
  </div>
</div>

<!-- Sales dialog -->
<div class="dialog-overlay" id="sales-overlay">
  <div class="dialog" id="sales-dialog">
    <h2 id="sales-title">🏠 Hvor mange købte?</h2>
    <p>Tryk på et tal eller skriv selv</p>
    <div class="amount-grid" id="amount-grid">
      <button class="amount-btn zero-btn" data-value="0">0</button>
      <button class="amount-btn" data-value="1">1</button>
      <button class="amount-btn" data-value="2">2</button>
      <button class="amount-btn" data-value="3">3</button>
      <button class="amount-btn" data-value="4">4</button>
      <button class="amount-btn" data-value="5">5</button>
      <button class="amount-btn" data-value="6">6</button>
      <button class="amount-btn" data-value="7">7</button>
      <button class="amount-btn" data-value="8">8</button>
      <button class="amount-btn" data-value="9">9</button>
    </div>
    <div class="custom-input-row">
      <input type="number" id="custom-amount" placeholder="Andet antal..." min="0" max="999" inputmode="numeric">
    </div>
    <button class="dialog-confirm-btn" id="btn-nothome" style="background:rgba(245,158,11,.15);color:#f59e0b;border:2px solid rgba(245,158,11,.25);margin-bottom:8px">🚫 Ikke hjemme</button>
    <button class="dialog-confirm-btn" id="sales-confirm">✅ Bekræft</button>
    <button class="dialog-cancel-btn" id="sales-cancel">Annuller</button>
  </div>
</div>

<!-- Inventory dialog -->
<div class="dialog-overlay center" id="inv-overlay">
  <div class="dialog center-dialog" id="inv-dialog">
    <h2>📦 Opdater lager</h2>
    <div style="text-align:center;font-size:14px;color:rgba(255,255,255,.5);margin-bottom:14px">
      Nuværende: <strong style="color:#60a5fa" id="inv-current-label">0</strong> stk
    </div>
    <label for="inv-input">Tilføj til lageret:</label>
    <input type="number" id="inv-input" min="0" max="99999" inputmode="numeric">
    <div class="btn-row" style="margin-bottom:4px">
      <button id="inv-cancel">Annuller</button>
      <button id="inv-save">💾 Gem</button>
    </div>
    <hr class="inv-divider">
    <label for="inv-subtract">Træk fra lageret:</label>
    <div class="inv-sub-row">
      <input type="number" id="inv-subtract" min="0" max="99999" inputmode="numeric" placeholder="Antal...">
      <button id="inv-subtract-btn">➖ Træk</button>
    </div>
  </div>
</div>

<!-- Menu dialog (settings only) -->
<div class="dialog-overlay center" id="menu-overlay">
  <div class="dialog center-dialog" style="max-width:320px">
    <h2>⚙️ Menu</h2>
    <p class="sub">Indstillinger og værktøjer</p>
    <ul class="menu-list">
      <li><button id="menu-backup"><span>💾</span> Download backup</button></li>
      <li><button id="menu-restore"><span>📂</span> Gendan backup</button></li>
      <li><button id="menu-reset-timer"><span>⏱️</span> Nulstil timeløn</button></li>
      <li><button id="menu-reset" class="danger"><span>🗑️</span> Nulstil alle data</button></li>
      <li><button id="menu-close" style="color:rgba(255,255,255,.4);justify-content:center;font-size:13px">Luk</button></li>
    </ul>
    <input type="file" id="backup-file-input" accept=".json" style="display:none">
  </div>
</div>

<script>
const APP_KEY = 'lodsaelder_data';

function loadData() {
  try {
    const raw = localStorage.getItem(APP_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && typeof data.markers === 'undefined') data.markers = [];
      if (data && typeof data.totalInventory === 'undefined') data.totalInventory = 100;
      if (data && typeof data.workStartTime === 'undefined') data.workStartTime = null;
      if (data && typeof data.totalWorkMs === 'undefined') data.totalWorkMs = 0;
      if (data && typeof data.timerEnabledAt === 'undefined') data.timerEnabledAt = null;
      if (data && typeof data.currentSessionStart === 'undefined') data.currentSessionStart = null;
      return data;
    }
  } catch(e) {}
  return { markers: [], totalInventory: 100, workStartTime: null, totalWorkMs: 0, timerEnabledAt: null, currentSessionStart: null };
}

function saveData() {
  localStorage.setItem(APP_KEY, JSON.stringify(data));
}

let data = loadData();

if (data.workStartTime) {
  data.totalWorkMs += Date.now() - data.workStartTime;
  data.workStartTime = null;
  saveData();
}

let pendingLat = null;
let pendingLng = null;
let editingLat = null;
let editingLng = null;
let selectedAmount = null;
let statsOverlayMode = 'route';

function autoStartTimer() {
  if (!data.workStartTime) {
    data.currentSessionStart = Date.now();
    data.timerEnabledAt = data.timerEnabledAt || Date.now();
    data.workStartTime = Date.now();
    saveData();
    updateStats();
  }
}

function formatElapsed(ms) {
  var s = Math.floor(ms / 1000);
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;
  return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

const map = L.map('map', { center: [55.6761, 12.5683], zoom: 13, zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 19
}).addTo(map);

let locationMarker = null;
map.locate({ setView: false, enableHighAccuracy: true });
map.on('locationfound', function(e) {
  if (locationMarker) map.removeLayer(locationMarker);
  locationMarker = L.circleMarker(e.latlng, {
    radius: 8, color: '#3b82f6', fillColor: '#60a5fa', fillOpacity: .8, weight: 3, opacity: .6
  }).addTo(map);
  if (map.getZoom() < 15) map.setView(e.latlng, 15);
  else map.setView(e.latlng);
});
map.on('locationerror', function() {});

var markerGroup = L.featureGroup().addTo(map);

function createIcon(sold) {
  var color, svg;
  if (sold === -1) {
    color = '#f59e0b';
    svg = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1L1 7v8h5v-5h4v5h5V7L8 1z" fill="#fff" stroke="#fff" stroke-width=".5"/></svg>';
  } else {
    color = sold === 0 ? '#ef4444' : '#22c55e';
    svg = '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2L12 12M12 2L2 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>';
  }
  return L.divIcon({
    className: '',
    html: '<div style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:' + color + ';border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.4)">' + svg + '</div>',
    iconSize: [26, 26], iconAnchor: [13, 13]
  });
}

function createRingCircle(latlng) {
  return L.circleMarker(latlng, { radius: 15, color: '#f87171', fill: false, weight: 3, opacity: .7, dashArray: '4,6' });
}

function getMarkerId(lat, lng) {
  return data.markers.findIndex(function(m) {
    return Math.abs(m.lat - lat) < 0.000001 && Math.abs(m.lng - lng) < 0.000001;
  });
}

function placeMarker(m) {
  var isZero = m.sold === 0;
  var isNone = m.sold === -1;
  var icon = createIcon(m.sold);
  var marker = L.marker([m.lat, m.lng], { icon }).addTo(markerGroup);
  var mid = getMarkerId(m.lat, m.lng);

  var statusLabel, statusText, moneyLine;
  if (isNone) {
    statusLabel = 'Ikke hjemme';
    statusText = '🚫 Ingen hjemme';
    moneyLine = '';
  } else if (isZero) {
    statusLabel = 'Ingen køb';
    statusText = '❌ 0 stk';
    moneyLine = '<div style="font-size:12px;color:rgba(255,255,255,.4);margin:2px 0 6px">+ 0 kr</div>';
  } else {
    statusLabel = 'Solgt';
    statusText = '✅ ' + m.sold + ' stk';
    moneyLine = '<div style="font-size:12px;color:rgba(255,255,255,.4);margin:2px 0 6px">+ ' + (m.sold * 20) + ' kr</div>';
  }

  marker.bindPopup(
    '<div class="sold-popup-content">' +
      '<div class="popup-label">' + statusLabel + '</div>' +
      '<div class="popup-sold">' + statusText + '</div>' + moneyLine +
      '<div class="popup-btn-row">' +
        '<button class="popup-btn popup-edit-btn" data-idx="' + mid + '">✏️ Rediger</button>' +
        '<button class="popup-btn popup-delete-btn" data-idx="' + mid + '">🗑️ Slet</button>' +
      '</div>' +
    '</div>',
    { className: 'sold-popup', closeButton: false, offset: [0, -8] }
  );

  marker.on('popupopen', function() {
    document.querySelectorAll('.popup-edit-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var idx = parseInt(this.dataset.idx);
        if (idx >= 0 && idx < data.markers.length) {
          var mm = data.markers[idx];
          map.closePopup();
          openEditDialog(mm.lat, mm.lng, mm.sold);
        }
      });
    });
    document.querySelectorAll('.popup-delete-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var idx = parseInt(this.dataset.idx);
        if (idx >= 0 && idx < data.markers.length) {
          data.markers.splice(idx, 1);
          saveData();
          rebuildAllMarkers();
          map.closePopup();
        }
      });
    });
  });

  if (m.sold === 0) {
    marker.ringCircle = createRingCircle([m.lat, m.lng]);
    marker.ringCircle.addTo(markerGroup);
  }
  return marker;
}

function rebuildAllMarkers() {
  markerGroup.clearLayers();
  data.markers.forEach(placeMarker);
  updateStats();
}

function getElapsedMs() {
  if (!data.workStartTime) return 0;
  return Date.now() - data.workStartTime;
}

function getTotalElapsedMs() {
  var ms = data.totalWorkMs;
  if (data.workStartTime) ms += Date.now() - data.workStartTime;
  return ms;
}

function computeStats(filterSince) {
  var totalSold = 0, totalEarned = 0, housesBought = 0, notHome = 0, totalVisited = 0;
  data.markers.forEach(function(m) {
    totalVisited++;
    if (m.sold > 0) { totalSold += m.sold; housesBought++; }
    if (m.sold === -1) notHome++;
  });
  totalEarned = totalSold * 20;

  var routeSold = 0, routeEarned = 0, routeBought = 0, routeNotHome = 0, routeVisited = 0;
  if (filterSince) {
    data.markers.forEach(function(m) {
      if (m.timestamp >= filterSince) {
        routeVisited++;
        if (m.sold > 0) { routeSold += m.sold; routeBought++; }
        if (m.sold === -1) routeNotHome++;
      }
    });
    routeEarned = routeSold * 20;
  }

  return {
    total: { sold: totalSold, earned: totalEarned, bought: housesBought, notHome: notHome, visited: totalVisited, remaining: data.totalInventory - totalSold },
    route: { sold: routeSold, earned: routeEarned, bought: routeBought, notHome: routeNotHome, visited: routeVisited }
  };
}

function updateStats() {
  var s = computeStats(data.currentSessionStart);
  var elapsedMs = getElapsedMs();
  var elapsedH = elapsedMs / 3600000;
  var elapsedMin = elapsedMs / 60000;
  var isWorking = !!data.workStartTime;

  document.body.classList.toggle('working', isWorking);

  document.getElementById('sold-count').textContent = s.total.sold + ' stk';
  document.getElementById('earned-amount').textContent = s.total.earned + ' kr';
  document.getElementById('remaining-count').textContent = Math.max(0, s.total.remaining) + ' stk';
  document.getElementById('remaining-count').className = 'stat-value ' + (s.total.remaining < 0 ? 'red' : 'blue');

  document.getElementById('timer-display').textContent = formatElapsed(elapsedMs);
  document.getElementById('sold-now').textContent = s.route.sold + ' stk';
  document.getElementById('sold-total-work').textContent = s.total.sold + ' stk';

  var wageEl = document.getElementById('hourly-wage');
  if (elapsedMs > 0 && s.route.earned > 0) {
    wageEl.textContent = Math.round(s.route.earned / elapsedH) + ' kr';
  } else {
    wageEl.textContent = '0 kr';
  }

  if (document.getElementById('stats-overlay').classList.contains('active')) {
    renderStatsOverlay();
  }
}

/* ---- Stats overlay ---- */
function openStatsOverlay() {
  document.getElementById('stats-overlay').classList.add('active');
  if (!data.workStartTime) {
    statsOverlayMode = 'all';
    document.querySelectorAll('#stats-toggle button').forEach(function(b) {
      b.classList.toggle('active', b.dataset.mode === 'all');
    });
  } else {
    statsOverlayMode = 'route';
    document.querySelectorAll('#stats-toggle button').forEach(function(b) {
      b.classList.toggle('active', b.dataset.mode === 'route');
    });
  }
  renderStatsOverlay();
}

document.getElementById('stats-toggle').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  statsOverlayMode = btn.dataset.mode;
  this.querySelectorAll('button').forEach(function(b) { b.classList.toggle('active', b === btn); });
  renderStatsOverlay();
});

function renderStatsOverlay() {
  var s = computeStats(data.currentSessionStart);
  var elapsedMs = getElapsedMs();
  var elapsedH = elapsedMs / 3600000;
  var elapsedMin = elapsedMs / 60000;
  var lines = '';

  if (statsOverlayMode === 'route') {
    var avgMin = '-', timeBetween = '-', wage = '0 kr', projHour = '0 kr';
    var successRate = '-', avgPerBuy = '-', housesPerHour = '-';

    if (elapsedMs > 0 && s.route.sold > 0) avgMin = (elapsedMin / s.route.sold).toFixed(1) + ' min';
    if (s.route.visited > 1 && elapsedMs > 0) timeBetween = (elapsedMin / (s.route.visited - 1)).toFixed(1) + ' min';
    else if (s.route.visited === 1 && elapsedMs > 0) timeBetween = formatElapsed(elapsedMs);
    if (elapsedMs > 0 && s.route.earned > 0) wage = Math.round(s.route.earned / elapsedH) + ' kr';
    if (elapsedMs > 0 && s.route.earned > 0) projHour = Math.round(s.route.earned / elapsedH) + ' kr';
    if (s.route.visited > 0) successRate = Math.round((s.route.bought / s.route.visited) * 100) + '%';
    if (s.route.bought > 0) avgPerBuy = (s.route.sold / s.route.bought).toFixed(1) + ' stk';
    if (elapsedMs > 0 && s.route.visited > 0) housesPerHour = (s.route.visited / elapsedH).toFixed(1);

    lines += row('⏱️ Tid', formatElapsed(elapsedMs));
    lines += row('🛒 Solgt', s.route.sold + ' stk');
    lines += row('💰 Tjent', s.route.earned + ' kr');
    lines += row('🚶 Besøgt', s.route.visited);
    lines += row('🏪 Købte', s.route.bought);
    lines += row('🚫 Ikke hjemme', s.route.notHome);
    lines += row('📦 Tilbage', Math.max(0, s.total.remaining) + ' stk');
    lines += '<hr style="border:none;border-top:1px solid rgba(255,255,255,.08);margin:8px 0">';
    lines += row('💰 Time løn', wage);
    lines += row('📈 Estimeret/time', projHour);
    lines += row('⏱️ Min/salg', avgMin);
    lines += row('🏠 Tid mellem huse', timeBetween);
    lines += row('🎯 Success rate', successRate);
    lines += row('📦 Gns. stk/køb', avgPerBuy);
    lines += row('🏃 Huse/time', housesPerHour);
  } else {
    var totalMs = getTotalElapsedMs();
    var totalH = totalMs / 3600000;
    var allSuccess = '-', allAvgPerBuy = '-', allWage = '-';

    if (s.total.visited > 0) allSuccess = Math.round((s.total.bought / s.total.visited) * 100) + '%';
    if (s.total.bought > 0) allAvgPerBuy = (s.total.sold / s.total.bought).toFixed(1) + ' stk';
    if (totalMs > 0 && s.total.earned > 0) allWage = Math.round(s.total.earned / totalH) + ' kr';

    lines += row('🏠 Solgt i alt', s.total.sold + ' stk');
    lines += row('💰 Tjent i alt', s.total.earned + ' kr');
    lines += row('🚶 Besøgt i alt', s.total.visited);
    lines += row('🏪 Købte i alt', s.total.bought);
    lines += row('🚫 Ikke hjemme i alt', s.total.notHome);
    lines += row('📦 Tilbage', Math.max(0, s.total.remaining) + ' stk');
    lines += '<hr style="border:none;border-top:1px solid rgba(255,255,255,.08);margin:8px 0">';
    lines += row('🎯 Success rate', allSuccess);
    lines += row('📦 Gns. stk/køb', allAvgPerBuy);
    lines += row('💰 Gns. time løn', allWage);
    if (totalMs > 0 && s.total.sold > 0) lines += row('⏱️ Gns. min/salg', (totalMs / 60000 / s.total.sold).toFixed(1) + ' min');
    if (totalMs > 0 && s.total.visited > 0) lines += row('🏃 Huse/time', (s.total.visited / totalH).toFixed(1));
  }

  document.getElementById('stats-detail').innerHTML = lines;
}

function row(label, value) {
  return '<div class="detail-row"><span class="detail-label">' + label + '</span><span class="detail-val">' + value + '</span></div>';
}

document.getElementById('stats-overlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('active');
});

/* ---- Sales dialog ---- */
function openSalesDialog(title) {
  document.getElementById('sales-title').textContent = title;
  document.getElementById('sales-overlay').classList.add('active');
}

function closeSalesDialog() {
  document.getElementById('sales-overlay').classList.remove('active');
  pendingLat = null; pendingLng = null; editingLat = null; editingLng = null; selectedAmount = null;
  clearAmountSelection();
  document.getElementById('custom-amount').value = '';
}

function clearAmountSelection() {
  document.querySelectorAll('.amount-btn').forEach(function(b) { b.classList.remove('sel'); });
}

function selectAmount(val) {
  selectedAmount = val;
  clearAmountSelection();
  document.querySelectorAll('.amount-btn').forEach(function(b) {
    if (parseInt(b.dataset.value) === val) { b.classList.add('sel'); if (val === 0) b.classList.add('zero-btn'); }
  });
}

function openEditDialog(lat, lng, sold) {
  editingLat = lat; editingLng = lng; pendingLat = null; pendingLng = null; selectedAmount = sold;
  clearAmountSelection();
  document.getElementById('custom-amount').value = '';
  selectAmount(sold);
  openSalesDialog('✏️ Rediger salg');
}

map.on('click', function(e) {
  pendingLat = e.latlng.lat; pendingLng = e.latlng.lng;
  editingLat = null; editingLng = null; selectedAmount = null;
  clearAmountSelection();
  document.getElementById('custom-amount').value = '';
  openSalesDialog('🏠 Hvor mange købte?');
});

document.getElementById('amount-grid').addEventListener('click', function(e) {
  var btn = e.target.closest('.amount-btn');
  if (!btn) return;
  selectAmount(parseInt(btn.dataset.value));
});

document.getElementById('custom-amount').addEventListener('input', function() {
  var val = this.value.trim();
  if (val !== '') { var num = parseInt(val); if (!isNaN(num) && num >= 0) { selectedAmount = num; clearAmountSelection(); } }
  else selectedAmount = null;
});

document.getElementById('btn-nothome').addEventListener('click', function() {
  if (pendingLat === null && pendingLng === null && editingLat === null && editingLng === null) return;
  if (editingLat !== null && editingLng !== null) {
    var idx = getMarkerId(editingLat, editingLng);
    if (idx >= 0) { data.markers[idx].sold = -1; saveData(); rebuildAllMarkers(); }
  } else {
    autoStartTimer();
    data.markers.push({ lat: pendingLat, lng: pendingLng, sold: -1, timestamp: Date.now() });
    saveData(); rebuildAllMarkers();
  }
  closeSalesDialog();
});

document.getElementById('sales-confirm').addEventListener('click', function() {
  var amount = selectedAmount;
  var customVal = document.getElementById('custom-amount').value.trim();
  if (customVal !== '') { var parsed = parseInt(customVal); if (!isNaN(parsed) && parsed >= 0) amount = parsed; }
  if (amount === null || amount < 0) {
    this.textContent = '⚠️ Vælg et antal først!';
    var self = this;
    setTimeout(function() { self.textContent = '✅ Bekræft'; }, 1000);
    return;
  }
  if (editingLat !== null && editingLng !== null) {
    var idx = getMarkerId(editingLat, editingLng);
    if (idx >= 0) { data.markers[idx].sold = amount; saveData(); rebuildAllMarkers(); }
  } else if (pendingLat !== null && pendingLng !== null) {
    autoStartTimer();
    data.markers.push({ lat: pendingLat, lng: pendingLng, sold: amount, timestamp: Date.now() });
    saveData(); rebuildAllMarkers();
  }
  closeSalesDialog();
  this.textContent = '✅ Bekræft';
});

document.getElementById('sales-cancel').addEventListener('click', closeSalesDialog);
document.getElementById('sales-overlay').addEventListener('click', function(e) { if (e.target === this) closeSalesDialog(); });

/* ---- Inventory dialog ---- */
document.getElementById('inventory-btn').addEventListener('click', function() {
  document.getElementById('inv-input').value = '';
  document.getElementById('inv-input').placeholder = 'F.eks. 100';
  document.getElementById('inv-subtract').value = '';
  document.getElementById('inv-current-label').textContent = data.totalInventory;
  document.getElementById('inv-overlay').classList.add('active');
  setTimeout(function() { document.getElementById('inv-input').focus(); }, 200);
});

document.getElementById('inv-save').addEventListener('click', function() {
  var val = parseInt(document.getElementById('inv-input').value);
  if (!isNaN(val) && val > 0) { data.totalInventory += val; saveData(); updateStats(); }
  document.getElementById('inv-overlay').classList.remove('active');
});

document.getElementById('inv-subtract-btn').addEventListener('click', function() {
  var val = parseInt(document.getElementById('inv-subtract').value);
  if (!isNaN(val) && val > 0) {
    data.totalInventory = Math.max(0, data.totalInventory - val);
    saveData(); updateStats();
    document.getElementById('inv-current-label').textContent = data.totalInventory;
    document.getElementById('inv-input').value = data.totalInventory;
    document.getElementById('inv-subtract').value = '';
  }
});

document.getElementById('inv-cancel').addEventListener('click', function() { document.getElementById('inv-overlay').classList.remove('active'); });
document.getElementById('inv-overlay').addEventListener('click', function(e) { if (e.target === this) document.getElementById('inv-overlay').classList.remove('active'); });

/* ---- Menu (settings only) ---- */
document.getElementById('menu-btn').addEventListener('click', function() { document.getElementById('menu-overlay').classList.add('active'); });
document.getElementById('menu-close').addEventListener('click', function() { document.getElementById('menu-overlay').classList.remove('active'); });
document.getElementById('menu-overlay').addEventListener('click', function(e) { if (e.target === this) document.getElementById('menu-overlay').classList.remove('active'); });

document.getElementById('menu-backup').addEventListener('click', function() {
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'lodsaelder_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  document.getElementById('menu-overlay').classList.remove('active');
});

document.getElementById('menu-restore').addEventListener('click', function() {
  document.getElementById('backup-file-input').click();
  document.getElementById('menu-overlay').classList.remove('active');
});

document.getElementById('backup-file-input').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var imported = JSON.parse(ev.target.result);
      if (imported && typeof imported.markers !== 'undefined' && typeof imported.totalInventory !== 'undefined') {
        if (typeof imported.workStartTime === 'undefined') imported.workStartTime = null;
        if (typeof imported.totalWorkMs === 'undefined') imported.totalWorkMs = 0;
        if (typeof imported.timerEnabledAt === 'undefined') imported.timerEnabledAt = null;
        if (typeof imported.currentSessionStart === 'undefined') imported.currentSessionStart = null;
        if (confirm('📂 Gendan backup?\n\nDette vil erstatte ALLE nuværende data!\n\nMarkører: ' + imported.markers.length + '\nLager: ' + imported.totalInventory)) {
          data = imported; saveData(); rebuildAllMarkers();
        }
      } else { alert('❌ Ugyldig backup-fil. Data matcher ikke.'); }
    } catch(err) { alert('❌ Kunne ikke læse filen. Vælg en gyldig .json backup.'); }
  };
  reader.readAsText(file);
  this.value = '';
});

document.getElementById('menu-reset-timer').addEventListener('click', function() {
  data.workStartTime = null; data.totalWorkMs = 0; data.timerEnabledAt = null; data.currentSessionStart = null;
  saveData(); updateStats();
  document.getElementById('menu-overlay').classList.remove('active');
});

document.getElementById('menu-reset').addEventListener('click', function() {
  if (confirm('⚠️ Er du sikker?\n\nDet her sletter ALLE markører og nulstiller al statistik!')) {
    data = { markers: [], totalInventory: data.totalInventory, workStartTime: null, totalWorkMs: 0, timerEnabledAt: null, currentSessionStart: null };
    saveData(); rebuildAllMarkers();
    document.getElementById('menu-overlay').classList.remove('active');
  }
});

/* ---- Timer ---- */
document.getElementById('stop-btn').addEventListener('click', function(e) {
  e.stopPropagation();
  if (data.workStartTime) {
    if (confirm('⏹️ Stoppe timeren?')) {
      data.totalWorkMs += Date.now() - data.workStartTime;
      data.workStartTime = null;
      saveData(); updateStats();
    }
  }
});

setInterval(function() { if (data.workStartTime) updateStats(); }, 1000);

updateStats();
</script>
</body>
